<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña</title>
    <link rel="stylesheet" href="../CSS/CambiarContraseña.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="card">
            <h2 class="title">Cambiar contraseña</h2>
            <p class="subtitle">Por favor, ingresa tu nueva contraseña.</p>

            <form id="formCambiarContrasena">
                <div class="form-group">
                    <label for="nuevaContrasena">Nueva contraseña</label>
                    <div class="input-icon">
                        <i class="bi bi-lock-fill"></i>
                        <input type="password" id="nuevaContrasena" placeholder="Ingresa nueva contraseña" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmarContrasena">Confirmar contraseña</label>
                    <div class="input-icon">
                        <i class="bi bi-lock"></i>
                        <input type="password" id="confirmarContrasena" placeholder="Confirma tu contraseña" required>
                    </div>
                </div>

                <button type="submit" class="btn-ingresar">
                    <i class="bi bi-box-arrow-in-right"></i> Cambiar contraseña
                </button>

                <a href="login.html" class="btn-volver">
                    <i class="bi bi-arrow-left"></i> Volver al inicio de sesión
                </a>
            </form>
        </div>
    </div>
</body>
</html>
