<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <!-- CSS personalizado -->
  <link rel="stylesheet" href="../CSS/EmailRecuperacion.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
  <div class="container">
    <div class="card">
      <h2 class="title">Recuperar <span>Contraseña</span></h2>
      <p class="subtitle">Ingresa tu correo electrónico registrado.</p>

      <form id="emailForm">
        <div class="form-group">
          <label for="emailInput">Correo electrónico</label>
          <div class="input-icon">
            <i class="bi bi-envelope-fill"></i>
            <input type="email" id="emailInput" placeholder="ejemplo@correo.com" required>
          </div>
        </div>

        <button type="submit" class="btn-enviar">
          <i class="bi bi-send-fill"></i> Enviar
        </button>

        <a href="login.html" class="btn-volver">
          <i class="bi bi-arrow-left"></i> Volver al inicio de sesión
        </a>
      </form>
    </div>
  </div>

  <script src="../JS/emailrecuperacion.js"></script>
</body>
</html>
