<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>

    <!-- Bootstrap e íconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="../CSS/Recuperar.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <div class="container">
        <div class="card">
            <h2 class="title">Recuperar <span>Contraseña</span></h2>
            <p class="subtitle">Ingresa el código de verificación enviado a tu correo.</p>

            <form id="codeForm">
                <div class="form-group">
                    <label for="codeInput">Código de verificación</label>
                    <div class="input-icon">
                        <i class="bi bi-shield-lock-fill"></i>
                        <input type="text" id="codeInput" placeholder="Ingresa tu código" required>
                    </div>
                </div>

                <a href="#" id="resendCode" class="reenviar">
                    ¿No recibiste tu código? <strong>Reenviar</strong>
                </a>

                <button type="submit" class="btn-enviar">
                    <i class="bi bi-box-arrow-in-right"></i> Ingresar
                </button>

                <a href="login.html" class="btn-volver">
                    <i class="bi bi-arrow-left"></i> Volver al inicio de sesión
                </a>
            </form>
        </div>
    </div>

    <script src="../JS/recuperar.js"></script>
</body>
</html>
